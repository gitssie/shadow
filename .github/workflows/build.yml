name: dependency-source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOOKKIT: df15b2bae39b3602478d12b90e8537db90945a36
  HOOKKIT_REPOSITORY: gitssie/HookKit

jobs:
  rootless-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.HOOKKIT_REPOSITORY }}
          ref: ${{ env.HOOKKIT }}
          path: dependency-source/HookKit

      - name: Verify maintained HookKit source
        run: |
          test "$(python3 scripts/hookkit-source.py pin)" = "$(git -C dependency-source/HookKit rev-parse HEAD)"
          test "$(python3 scripts/hookkit-source.py repository)" = "$HOOKKIT_REPOSITORY"
          python3 scripts/check-hookkit-version.py packaging/controls/control.rootless.in \
            --source-control dependency-source/HookKit/packaging/layout/DEBIAN/control
          git -C dependency-source/HookKit apply --check "$GITHUB_WORKSPACE/.github/patches/hookkit-upstream-theos.patch"

      - name: Verify rootless build and dependency guards
        run: |
          make -C tests verify-toolchain verify-hookkit-version verify-hookkit-source
